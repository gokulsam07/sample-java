# Name of the workflow, shown in the GitHub Actions tab.
name: Run TestNG Tests

# Defines when the workflow runs.
on:
  workflow_dispatch:
    inputs:
      test_class:
        type: string
        description: 'TestNG test class to run (e.g., org.example.SampleTest)'
        required: false
        default: ''

# Customizes the display name of each run.
run-name: "Manual TestNG Run - ${{ github.event.inputs.test_class || 'All Tests' }}"

# Defines the job to execute.
jobs:
  test-job:
    name: Run TestNG Tests
    runs-on: ubuntu-latest # Use GitHub-hosted runner.
    steps:
      # Step: Checkout the repository code.
      - name: Checkout Code
        uses: actions/checkout@v4
      # Step: Set up JDK 17 for Maven.
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      # Step: Debug project structure.
      - name: List Project Files
        run: |
          echo "Listing files in src/test/java:"
          ls -l src/test/java || echo "No test files found"
          echo "Listing files in src/main/java:"
          ls -l src/main/java || echo "No main files found"
      # Step: Run Maven tests with TestNG.
      - name: Run Maven Tests
        run: |
          if [ -n "${{ github.event.inputs.test_class }}" ]; then
            mvn clean test -Dtest=${{ github.event.inputs.test_class }}
          else
            mvn clean test
          fi
        continue-on-error: true
      # Step: Store test artifacts on GitHub.
      - name: Upload Test Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: target/surefire-reports/
          retention-days: 7